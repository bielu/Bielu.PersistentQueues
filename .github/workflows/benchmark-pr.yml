name: Performance Benchmark on PR

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/Bielu.PersistentQueues/**'
      - 'src/Bielu.PersistentQueues.Storage.*/**'
      - 'src/Bielu.PersistentQueues.Benchmarks/**'
      - '.github/workflows/benchmark-pr.yml'
      - 'scripts/compare-benchmarks.mjs'

permissions:
  contents: read

# The PR is compared against its own base commit, benchmarked back to back on the same runner.
# Comparing against the gh-pages history instead meant comparing against whatever hardware an
# earlier run happened to land on: shared GitHub runners differ by up to ~1.5x, so every benchmark
# moved together and the 115% threshold failed PRs that touched no runtime code at all.
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout PR head
      uses: actions/checkout@v7
      with:
        path: head
        persist-credentials: false

    - name: Checkout PR base
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Run regression benchmarks (base)
      working-directory: base
      run: |
        dotnet run --project src/Bielu.PersistentQueues.Benchmarks/Bielu.PersistentQueues.Benchmarks.csproj \
          -c Release -- \
          --filter "*RegressionBenchmark*" \
          --exporters json \
          --artifacts ../artifacts/base

    - name: Run regression benchmarks (head)
      working-directory: head
      run: |
        dotnet run --project src/Bielu.PersistentQueues.Benchmarks/Bielu.PersistentQueues.Benchmarks.csproj \
          -c Release -- \
          --filter "*RegressionBenchmark*" \
          --exporters json \
          --artifacts ../artifacts/head

    # A script rather than github-action-benchmark: that action only compares against an entry
    # recorded for a *different* commit, and both runs here belong to the same workflow commit, so it
    # silently compared nothing. The table lands in the job summary.
    - name: Compare head against base
      run: |
        node head/scripts/compare-benchmarks.mjs \
          artifacts/base/results/Bielu.PersistentQueues.Benchmarks.RegressionBenchmark-report-full-compressed.json \
          artifacts/head/results/Bielu.PersistentQueues.Benchmarks.RegressionBenchmark-report-full-compressed.json \
          125

    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-results-pr-${{ github.event.pull_request.number }}
        path: artifacts/*/results/
        retention-days: 90
